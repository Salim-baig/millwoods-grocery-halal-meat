<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — Millwoods Grocery & Halal Meat</title>
  <link rel="stylesheet" href="assets/css/style.css?v=4" />
</head>
<body>
  <div id="header"></div>

  <div class="page-head">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / Community</div>
      <h1>Community</h1>
      <p>Follow us on social media for weekly specials, new arrivals, and community updates.</p>
    </div>
  </div>

  <section class="section">
    <div class="wrap" style="max-width:680px;">
      <div class="panel" style="text-align:center;">
        <div style="font-size:2.6rem;">📣</div>
        <h2 style="font-size:1.3rem; margin:6px 0;">Stay connected</h2>
        <p class="section-sub" style="margin:0 auto 20px;">
          We post our latest specials and announcements on social media. Give us a follow!</p>
        <div id="socialLinks" style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;"></div>
        <p style="font-size:0.82rem; color:var(--muted); margin-top:20px;">
          Questions? Call us at <a href="tel:+17804853504">(780) 485-3504</a> or visit us at 9232 34 Ave NW, Edmonton.</p>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/store.js?v=4"></script>
  <script src="assets/js/ui.js?v=4"></script>
  <script>
    window.PAGE = "community";

    const links = (STORE.social || []);
    document.getElementById("socialLinks").innerHTML = links.length
      ? links.map((s) => `<a class="btn btn-primary" href="${UI.esc(s.url)}" target="_blank" rel="noopener noreferrer" style="padding:13px 22px;">${s.icon} ${s.name}</a>`).join("")
      : `<p class="section-sub" style="margin:0;">Social links coming soon.</p>`;
  </script>
</body>
</html>
