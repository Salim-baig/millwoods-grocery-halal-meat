<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Millwoods Grocery & Halal Meat</title>
  <link rel="stylesheet" href="assets/css/style.css?v=3" />
</head>
<body>
  <div id="header"></div>

  <div class="page-head">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / Products</div>
      <h1>Halal meat &amp; groceries</h1>
      <p>A look at what we carry in store. Meat prices change weekly with the market — call or visit for today's prices.</p>
    </div>
  </div>

  <section class="section">
    <div class="wrap">
      <div class="filters" id="filters"></div>
      <div class="grid grid-4" id="productGrid"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/data.js?v=3"></script>
  <script src="assets/js/store.js?v=3"></script>
  <script src="assets/js/ui.js?v=3"></script>
  <script>
    window.PAGE = "shop";

    /* category filters */
    const cats = ["All", ...new Set(PRODUCTS.map((p) => p.category))];
    let active = location.hash ? decodeURIComponent(location.hash.slice(1)) : "All";
    if (!cats.includes(active)) active = "All";

    function renderFilters() {
      document.getElementById("filters").innerHTML = cats.map((c) =>
        `<button class="chip ${c === active ? "active" : ""}" onclick="setCat('${c}')">${c}</button>`
      ).join("");
    }
    function setCat(c) { active = c; renderFilters(); renderGrid(); }
    window.setCat = setCat;

    function renderGrid() {
      const list = active === "All" ? PRODUCTS : PRODUCTS.filter((p) => p.category === active);
      document.getElementById("productGrid").innerHTML = list.map((p) => `
        <a class="product-card" href="product.html?id=${p.id}" style="text-decoration:none;color:inherit;">
          <div class="product-thumb">${UI.thumbInner(p)}</div>
          <div class="product-body">
            <span class="cat">${UI.esc(p.category)}</span>
            <h3>${UI.esc(p.name)}</h3>
            <p class="desc">${UI.esc(p.desc)}</p>
          </div>
        </a>`).join("");
    }

    renderFilters();
    renderGrid();
  </script>
</body>
</html>
