<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Millwoods Grocery & Halal Meat</title>
  <link rel="stylesheet" href="assets/css/style.css?v=4" />
</head>
<body>
  <div id="header"></div>

  <section class="section">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Products</a> / <span id="crumb"></span></div>
      <div id="pdp"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <h2 class="section-title">More from the store</h2>
      <div class="grid grid-4" id="related"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/js/jsbarcode.min.js?v=4"></script>
  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/store.js?v=4"></script>
  <script src="assets/js/ui.js?v=4"></script>
  <script src="assets/js/barcode.js?v=4"></script>
  <script>
    window.PAGE = "shop";

    const id = new URLSearchParams(location.search).get("id");
    const p = PRODUCTS.find((x) => x.id === id) || PRODUCTS[0];
    document.getElementById("crumb").textContent = p.name;
    document.title = p.name + " — Millwoods Halal";

    const meatNote = (p.unit === "lb" || p.butcher)
      ? "Cut fresh at our in-store counter. Prices change weekly with the market — please call or visit for today's price."
      : "Available in store. Please call or visit for today's price.";

    document.getElementById("pdp").innerHTML = `
      <div class="pdp">
        <div class="pdp-image">${UI.thumbInner(p)}</div>
        <div>
          <span class="cat" style="font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">${UI.esc(p.category)}</span>
          <h1>${UI.esc(p.name)}</h1>
          <p style="color:var(--muted);margin-bottom:14px;">${UI.esc(p.desc)}</p>
          <div style="background:var(--green-light);border-radius:var(--radius);padding:14px 16px;font-size:0.92rem;color:var(--green-dark);">
            ${meatNote}
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
            <a class="btn btn-primary" href="tel:+17804853504">📞 Call (780) 485-3504</a>
            <a class="btn btn-ghost" href="shop.html">← Back to products</a>
          </div>
          <div style="border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:18px;text-align:center;">
            <h3 style="font-size:0.9rem;color:var(--ink);margin-bottom:8px;">🏷️ In-store barcode</h3>
            <svg id="pdpBarcode" style="max-width:100%;"></svg>
            <p style="font-size:0.78rem;color:var(--muted);margin-top:2px;">Shopping in store? Staff scan this at the counter.</p>
          </div>
        </div>
      </div>`;

    Barcode.render(document.getElementById("pdpBarcode"), Barcode.value(p));

    /* related (browse only) */
    const related = PRODUCTS.filter((x) => x.id !== p.id).slice(0, 4);
    document.getElementById("related").innerHTML = related.map((r) => `
      <a class="product-card" href="product.html?id=${r.id}" style="text-decoration:none;color:inherit;">
        <div class="product-thumb">${UI.thumbInner(r)}</div>
        <div class="product-body">
          <span class="cat">${UI.esc(r.category)}</span>
          <h3>${UI.esc(r.name)}</h3>
        </div>
      </a>`).join("");
  </script>
</body>
</html>
